<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📖 语文错题系统</title>
    <!-- 引入 SheetJS 用于导出 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ========== 全局重置 & 基础 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            color: #1e293b;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        /* ========== 主容器 ========== */
        .app {
            width: 1440px;
            max-width: 100%;
            height: 96vh;
            max-height: 900px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* ========== 顶部栏 ========== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 32px;
            background: linear-gradient(135deg, #1e293b, #2d3a4f);
            color: #f1f5f9;
            flex-shrink: 0;
        }
        .app-header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header h1 span {
            font-weight: 300;
            font-size: 14px;
            opacity: 0.7;
            margin-left: 6px;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-excel {
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.35);
        }
        .btn-excel:hover {
            background: #16a34a;
            transform: scale(1.02);
        }
        .btn-excel:active {
            transform: scale(0.96);
        }
        .btn-clear-all {
            background: rgba(255, 255, 255, 0.10);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.20);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-clear-all:hover {
            background: rgba(239, 68, 68, 0.35);
            border-color: #ef4444;
        }
        .badge-count {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 400;
        }
        /* ========== 主体布局 ========== */
        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        /* ========== 左侧导航 ========== */
        .nav-side {
            width: 180px;
            background: #f8fafc;
            border-right: 1px solid #e9edf2;
            padding: 20px 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            margin: 0 12px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            background: transparent;
            width: calc(100% - 24px);
            text-align: left;
        }
        .nav-item:hover {
            background: #eef2f6;
            color: #0f172a;
        }
        .nav-item.active {
            background: #1e293b;
            color: #f1f5f9;
            box-shadow: 0 6px 16px rgba(30, 41, 59, 0.25);
        }
        .nav-item .icon {
            font-size: 20px;
        }
        .nav-item .label {
            flex: 1;
        }
        .nav-item .count-badge {
            background: rgba(255, 255, 255, 0.20);
            padding: 0 10px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 400;
        }
        .nav-item.active .count-badge {
            background: rgba(255, 255, 255, 0.20);
        }
        .nav-divider {
            height: 1px;
            background: #e9edf2;
            margin: 8px 20px;
        }
        .nav-footer {
            margin-top: auto;
            padding: 12px 20px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #e9edf2;
            margin: 0 12px;
            padding-top: 16px;
        }
        /* ========== 右侧内容 ========== */
        .content-area {
            flex: 1;
            padding: 28px 36px;
            overflow-y: auto;
            background: #ffffff;
        }
        /* ========== 录入界面 ========== */
        .page-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
        }
        .page-title .sub {
            font-weight: 400;
            font-size: 14px;
            color: #94a3b8;
        }
        .form-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 28px 32px;
            max-width: 720px;
            border: 1px solid #eef2f6;
        }
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .form-row label {
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-row label .required {
            color: #ef4444;
        }
        .form-row .hint {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 400;
        }
        .form-row input,
        .form-row select,
        .form-row textarea {
            padding: 10px 14px;
            border: 1.5px solid #dce1e8;
            border-radius: 12px;
            font-size: 15px;
            background: #ffffff;
            transition: 0.2s;
            font-family: inherit;
            outline: none;
            width: 100%;
        }
        .form-row input:focus,
        .form-row select:focus,
        .form-row textarea:focus {
            border-color: #1e293b;
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.10);
        }
        .form-row textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-row .type-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-row .type-tag {
            padding: 6px 18px;
            border-radius: 40px;
            border: 2px solid #dce1e8;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
            color: #475569;
        }
        .form-row .type-tag:hover {
            border-color: #94a3b8;
        }
        .form-row .type-tag.active {
            border-color: #1e293b;
            background: #1e293b;
            color: #fff;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: #1e293b;
            color: #fff;
            border: none;
            padding: 10px 32px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-primary:hover {
            background: #0f172a;
            transform: scale(1.01);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: #eef2f6;
            color: #1e293b;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .btn-success {
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 10px 32px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            animation: fadeSlide 0.3s ease;
        }
        .toast.show {
            display: flex;
        }
        .toast.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .toast.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* ========== 复习 / 考试界面 ========== */
        .exam-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .exam-header .info {
            font-size: 14px;
            color: #64748b;
        }
        .exam-header .info strong {
            color: #0f172a;
        }
        .exam-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 28px 32px;
            border: 1px solid #eef2f6;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .exam-question {
            font-size: 22px;
            font-weight: 500;
            color: #0f172a;
            margin-bottom: 8px;
            line-height: 1.6;
        }
        .exam-question .tag {
            display: inline-block;
            font-size: 13px;
            font-weight: 400;
            color: #64748b;
            background: #eef2f6;
            padding: 2px 12px;
            border-radius: 40px;
            margin-right: 12px;
            vertical-align: middle;
        }
        .exam-question .source-label {
            font-size: 14px;
            font-weight: 400;
            color: #94a3b8;
            margin-left: 8px;
        }
        .exam-answer-area {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            align-items: center;
        }
        .exam-answer-area input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1.5px solid #dce1e8;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .exam-answer-area input:focus {
            border-color: #1e293b;
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.10);
        }
        .exam-answer-area input.correct {
            border-color: #22c55e;
            background: #f0fdf4;
        }
        .exam-answer-area input.wrong {
            border-color: #ef4444;
            background: #fef2f2;
        }
        .exam-result {
            margin-top: 12px;
            font-size: 15px;
            padding: 10px 16px;
            border-radius: 12px;
            background: #f1f5f9;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .exam-result.show {
            display: flex;
        }
        .exam-result.correct {
            background: #dcfce7;
            color: #166534;
        }
        .exam-result.wrong {
            background: #fee2e2;
            color: #991b1b;
        }
        .exam-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .exam-empty {
            text-align: center;
            padding: 48px 20px;
            color: #94a3b8;
        }
        .exam-empty .big-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        /* ========== 智能总结 ========== */
        .summary-section {
            margin-top: 12px;
            border-top: 1px solid #e9edf2;
            padding-top: 20px;
        }
        .summary-section .summary-title {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }
        .summary-card {
            background: #f1f5f9;
            border-radius: 14px;
            padding: 14px 18px;
            text-align: center;
        }
        .summary-card .num {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
        }
        .summary-card .label {
            font-size: 13px;
            color: #64748b;
            margin-top: 2px;
        }
        .summary-card .num.warn {
            color: #ef4444;
        }
        .summary-card .num.ok {
            color: #22c55e;
        }
        .wrong-list {
            background: #f8fafc;
            border-radius: 14px;
            padding: 14px 18px;
            border: 1px solid #eef2f6;
        }
        .wrong-list .item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #e9edf2;
            font-size: 14px;
            align-items: center;
        }
        .wrong-list .item:last-child {
            border-bottom: none;
        }
        .wrong-list .item .count {
            background: #fee2e2;
            color: #991b1b;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        /* ========== 错题列表（复习模式下的列表） ========== */
        .review-list {
            margin-top: 16px;
            border-top: 1px solid #e9edf2;
            padding-top: 16px;
        }
        .review-list .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .review-list .list-header .title {
            font-weight: 600;
            font-size: 15px;
            color: #0f172a;
        }
        .review-list .list-header .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .review-list table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .review-list table th {
            background: #f1f5f9;
            text-align: left;
            padding: 8px 12px;
            font-weight: 600;
            color: #475569;
            border-bottom: 2px solid #dce1e8;
        }
        .review-list table td {
            padding: 8px 12px;
            border-bottom: 1px solid #eef2f6;
            vertical-align: middle;
        }
        .review-list table tr:hover td {
            background: #fafbfc;
        }
        .review-list .tag-type {
            display: inline-block;
            padding: 0 10px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            background: #eef2f6;
            color: #475569;
        }
        .review-list .tag-type.character {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .review-list .tag-type.sentence {
            background: #fce7f3;
            color: #be185d;
        }
        .review-list .tag-type.poem {
            background: #d1fae5;
            color: #065f46;
        }
        .review-list .btn-sm {
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .review-list .btn-sm.del {
            background: #fee2e2;
            color: #991b1b;
        }
        .review-list .btn-sm.del:hover {
            background: #fecaca;
        }
        .review-list .btn-sm.master {
            background: #dcfce7;
            color: #166534;
        }
        .review-list .btn-sm.master:hover {
            background: #bbf7d0;
        }
        .review-list .btn-sm.unmaster {
            background: #eef2f6;
            color: #475569;
        }
        .review-list .btn-sm.unmaster:hover {
            background: #e2e8f0;
        }
        .review-list .empty-msg {
            text-align: center;
            padding: 28px;
            color: #94a3b8;
            font-size: 14px;
        }
        /* ========== 滚动条 ========== */
        .content-area::-webkit-scrollbar {
            width: 5px;
        }
        .content-area::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        /* ========== 响应式 ========== */
        @media (max-width: 820px) {
            .app-body {
                flex-direction: column;
            }
            .nav-side {
                width: 100%;
                flex-direction: row;
                padding: 8px 12px;
                border-right: none;
                border-bottom: 1px solid #e9edf2;
                overflow-x: auto;
                gap: 4px;
                flex-shrink: 0;
            }
            .nav-item {
                padding: 10px 16px;
                margin: 0 4px;
                width: auto;
                font-size: 14px;
                white-space: nowrap;
            }
            .nav-footer {
                display: none;
            }
            .content-area {
                padding: 20px;
            }
            .app-header {
                padding: 14px 20px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .app-header h1 {
                font-size: 18px;
            }
            .form-card {
                padding: 20px;
            }
            .exam-card {
                padding: 20px;
            }
            .exam-question {
                font-size: 18px;
            }
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .review-list table {
                font-size: 13px;
            }
            .review-list table th,
            .review-list table td {
                padding: 6px 8px;
            }
        }
        @media (max-width: 480px) {
            .app {
                height: 100vh;
                max-height: none;
                border-radius: 0;
                padding: 0;
            }
            .app-header h1 span {
                display: none;
            }
            .header-actions .badge-count {
                display: none;
            }
            .form-row .type-tags {
                gap: 6px;
            }
            .form-row .type-tag {
                padding: 4px 14px;
                font-size: 13px;
            }
            .exam-answer-area {
                flex-direction: column;
                align-items: stretch;
            }
            .exam-answer-area input {
                min-width: auto;
            }
            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        /* ========== 工具类 ========== */
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .gap-8 {
            gap: 8px;
        }
        .text-muted {
            color: #94a3b8;
            font-size: 13px;
        }
        /* 下载按钮 */
        .btn-download {
            background: #8b5cf6;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-download:hover {
            background: #7c3aed;
            transform: scale(1.02);
        }
        .btn-download:active {
            transform: scale(0.96);
        }
        .btn-outline {
            background: transparent;
            color: #1e293b;
            border: 1.5px solid #dce1e8;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        /* 掌握标记小圆点 */
        .dot-mastered {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 4px;
        }
        .dot-unmastered {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
            margin-right: 4px;
        }
        /* 搜索框 */
        .search-box {
            padding: 6px 14px;
            border: 1.5px solid #dce1e8;
            border-radius: 40px;
            font-size: 13px;
            outline: none;
            width: 160px;
            transition: 0.2s;
            font-family: inherit;
        }
        .search-box:focus {
            border-color: #1e293b;
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.08);
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- ===== 顶部栏 ===== -->
        <header class="app-header">
            <h1>
                📖 语文错题系统
                <span>· 智能积累</span>
            </h1>
            <div class="header-actions">
                <span class="badge-count" id="totalBadge">📚 0 条</span>
                <button class="btn-excel" id="exportExcelBtn">📊 导出 Excel</button>
                <button class="btn-clear-all" id="clearAllBtn">🗑️ 清空</button>
            </div>
        </header>

        <!-- ===== 主体 ===== -->
        <div class="app-body">
            <!-- 左侧导航 -->
            <nav class="nav-side" id="navSide">
                <button class="nav-item active" data-tab="entry">
                    <span class="icon">✏️</span>
                    <span class="label">录入</span>
                </button>
                <button class="nav-item" data-tab="review">
                    <span class="icon">📝</span>
                    <span class="label">复习 · 考试</span>
                    <span class="count-badge" id="reviewBadge">0</span>
                </button>
                <div class="nav-divider"></div>
                <div class="nav-footer">
                    <div style="font-size:12px;opacity:0.6;">数据保存在本地</div>
                </div>
            </nav>

            <!-- 右侧内容 -->
            <div class="content-area" id="contentArea">
                <!-- ====== 录入面板 ====== -->
                <div id="panelEntry">
                    <div class="page-title">
                        ✏️ 录入错题
                        <span class="sub">· 支持字 / 句子 / 诗词</span>
                    </div>
                    <div class="form-card">
                        <form id="entryForm" autocomplete="off">
                            <!-- 类型选择 -->
                            <div class="form-row">
                                <label>类型 <span class="required">*</span></label>
                                <div class="type-tags" id="typeTags">
                                    <span class="type-tag active" data-type="character">🔤 字 / 词</span>
                                    <span class="type-tag" data-type="sentence">📄 句子</span>
                                    <span class="type-tag" data-type="poem">📜 诗词</span>
                                </div>
                            </div>

                            <!-- 内容 -->
                            <div class="form-row">
                                <label>内容 <span class="required">*</span></label>
                                <input type="text" id="inputContent" placeholder="例如：春风又绿江南岸" />
                                <div class="hint" id="contentHint">输入要记录的字、词、句子或诗句</div>
                            </div>

                            <!-- 出处 -->
                            <div class="form-row">
                                <label>出处 <span class="required">*</span></label>
                                <input type="text" id="inputSource" placeholder="例如：泊船瓜洲 / 课文第3课" />
                                <div class="hint">标明来源，方便复习时追溯</div>
                            </div>

                            <!-- 额外信息（动态） -->
                            <div class="form-row" id="extraRow">
                                <label id="extraLabel">拼音 / 上下句 <span class="required">*</span></label>
                                <input type="text" id="inputExtra" placeholder="例如：chun feng you lv jiang nan an" />
                                <div class="hint" id="extraHint">字/词填拼音；诗词填对应上下句</div>
                            </div>

                            <!-- 操作 -->
                            <div class="form-actions">
                                <button type="submit" class="btn-primary">➕ 录入</button>
                                <button type="reset" class="btn-secondary">🔄 重置</button>
                            </div>
                        </form>
                        <div class="toast" id="toast"></div>
                    </div>
                </div>

                <!-- ====== 复习 / 考试面板 ====== -->
                <div id="panelReview" class="hidden">
                    <div class="exam-container">
                        <!-- 考试头部 -->
                        <div class="exam-header">
                            <div>
                                <span class="page-title" style="margin-bottom:0;">
                                    📝 复习 · 考试
                                    <span class="sub" id="examSub">随机出题</span>
                                </span>
                            </div>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                <button class="btn-download" id="downloadPaperBtn">📥 下载试卷</button>
                                <button class="btn-secondary" id="resetExamBtn">🔄 重新出题</button>
                            </div>
                        </div>

                        <!-- 考试卡片 -->
                        <div class="exam-card" id="examCard">
                            <div id="examBody">
                                <!-- 由 JS 动态渲染 -->
                            </div>
                        </div>

                        <!-- 智能总结 -->
                        <div class="summary-section" id="summarySection">
                            <div class="summary-title">📊 智能总结</div>
                            <div class="summary-grid" id="summaryGrid">
                                <!-- 由 JS 渲染 -->
                            </div>
                            <div class="wrong-list" id="wrongList">
                                <!-- 由 JS 渲染 -->
                            </div>
                        </div>

                        <!-- 错题列表（复习模式下的数据管理） -->
                        <div class="review-list" id="reviewList">
                            <div class="list-header">
                                <span class="title">📋 全部错题</span>
                                <div class="controls">
                                    <input class="search-box" id="searchReview" placeholder="🔍 搜索内容..." />
                                    <select class="search-box" id="filterType" style="width:auto;padding:6px 12px;">
                                        <option value="all">全部类型</option>
                                        <option value="character">字/词</option>
                                        <option value="sentence">句子</option>
                                        <option value="poem">诗词</option>
                                    </select>
                                </div>
                            </div>
                            <div id="reviewTableWrap">
                                <!-- 由 JS 渲染 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  数据层
        // ================================================================
        const STORAGE_KEY = 'yuwen_cuoti_data';

        /** 默认数据结构 */
        function createItem(type, content, source, extra) {
            return {
                id: Date.now() + Math.random() * 1000,
                type: type, // 'character' | 'sentence' | 'poem'
                content: content.trim(),
                source: source.trim() || '未知出处',
                extra: extra ? extra.trim() : '',
                wrongCount: 0,
                mastered: false,
                createdAt: new Date().toISOString(),
            };
        }

        /** 读取数据 */
        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const arr = JSON.parse(raw);
                    if (Array.isArray(arr)) return arr;
                }
            } catch (_) { /* ignore */ }
            return [];
        }

        /** 保存数据 */
        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            updateBadges(data);
        }

        /** 更新角标 */
        function updateBadges(data) {
            const total = data.length;
            document.getElementById('totalBadge').textContent = `📚 ${total} 条`;
            const reviewBadge = document.getElementById('reviewBadge');
            const unmastered = data.filter(d => !d.mastered).length;
            reviewBadge.textContent = unmastered;
            reviewBadge.style.display = unmastered > 0 ? 'inline' : 'none';
        }

        // ================================================================
        //  应用状态
        // ================================================================
        let appData = loadData();
        let currentTab = 'entry'; // 'entry' | 'review'
        let examQueue = []; // 当前考试队列
        let examIndex = 0;
        let examAnswered = false;
        let examStats = { total: 0, correct: 0, wrong: 0 };

        // ================================================================
        //  DOM 引用
        // ================================================================
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const panelEntry = document.getElementById('panelEntry');
        const panelReview = document.getElementById('panelReview');
        const navItems = $$('.nav-item');
        const typeTags = $$('.type-tag');
        const inputContent = document.getElementById('inputContent');
        const inputSource = document.getElementById('inputSource');
        const inputExtra = document.getElementById('inputExtra');
        const extraLabel = document.getElementById('extraLabel');
        const extraHint = document.getElementById('extraHint');
        const contentHint = document.getElementById('contentHint');
        const entryForm = document.getElementById('entryForm');
        const toast = document.getElementById('toast');

        // ================================================================
        //  导航切换
        // ================================================================
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const tab = item.dataset.tab;
                switchTab(tab);
            });
        });

        function switchTab(tab) {
            currentTab = tab;
            navItems.forEach(n => n.classList.toggle('active', n.dataset.tab === tab));
            if (tab === 'entry') {
                panelEntry.classList.remove('hidden');
                panelReview.classList.add('hidden');
            } else {
                panelEntry.classList.add('hidden');
                panelReview.classList.remove('hidden');
                renderReviewPanel();
            }
        }

        // ================================================================
        //  录入功能
        // ================================================================
        let selectedType = 'character';

        typeTags.forEach(tag => {
            tag.addEventListener('click', () => {
                typeTags.forEach(t => t.classList.remove('active'));
                tag.classList.add('active');
                selectedType = tag.dataset.type;
                updateExtraField();
                updateContentHint();
            });
        });

        function updateExtraField() {
            if (selectedType === 'character') {
                extraLabel.textContent = '拼音 *';
                extraHint.textContent = '输入拼音，例如：chun feng you lv jiang nan an';
                inputExtra.placeholder = '例如：chun feng you lv jiang nan an';
            } else if (selectedType === 'poem') {
                extraLabel.textContent = '上下句 *';
                extraHint.textContent = '输入对应的上句或下句，例如：明月何时照我还';
                inputExtra.placeholder = '例如：明月何时照我还';
            } else {
                extraLabel.textContent = '备注（选填）';
                extraHint.textContent = '可填写补充说明或相关背景';
                inputExtra.placeholder = '选填备注...';
            }
        }

        function updateContentHint() {
            const hints = {
                character: '输入单个字或词语，例如：春 或 春风',
                sentence: '输入完整的句子，例如：学而时习之，不亦说乎',
                poem: '输入诗句（单句或整联），例如：春风又绿江南岸'
            };
            contentHint.textContent = hints[selectedType] || '输入内容';
        }

        // 录入提交
        entryForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const content = inputContent.value.trim();
            const source = inputSource.value.trim();
            const extra = inputExtra.value.trim();

            if (!content) {
                showToast('请输入内容', 'error');
                return;
            }
            if (!source) {
                showToast('请输入出处', 'error');
                return;
            }
            if (selectedType === 'character' && !extra) {
                showToast('字/词 必须填写拼音', 'error');
                return;
            }
            if (selectedType === 'poem' && !extra) {
                showToast('诗词必须填写上下句', 'error');
                return;
            }

            const item = createItem(selectedType, content, source, extra);
            appData.push(item);
            saveData(appData);
            entryForm.reset();
            // 重置类型为默认
            typeTags.forEach(t => t.classList.remove('active'));
            document.querySelector('.type-tag[data-type="character"]').classList.add('active');
            selectedType = 'character';
            updateExtraField();
            updateContentHint();
            showToast(`✅ 录入成功！共 ${appData.length} 条`, 'success');
            updateBadges(appData);
        });

        // 清空所有
        document.getElementById('clearAllBtn').addEventListener('click', () => {
            if (!appData.length) {
                showToast('暂无数据可清空', 'error');
                return;
            }
            if (confirm('⚠️ 确定要清空所有错题数据吗？此操作不可撤销！')) {
                appData = [];
                saveData(appData);
                showToast('已清空所有数据', 'success');
                if (currentTab === 'review') renderReviewPanel();
            }
        });

        // ================================================================
        //  Toast 提示
        // ================================================================
        let toastTimer = null;

        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = `toast show ${type}`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2800);
        }

        // ================================================================
        //  复习 / 考试 核心
        // ================================================================
        function renderReviewPanel() {
            renderExam();
            renderSummary();
            renderReviewTable();
            updateBadges(appData);
        }

        /** 获取可考试的题目（未掌握 + 已掌握但可复习） */
        function getExamPool() {
            // 默认所有题目都可以考，但优先未掌握的
            const unmastered = appData.filter(d => !d.mastered);
            const mastered = appData.filter(d => d.mastered);
            // 如果未掌握的多于5个，只考未掌握的；否则混合
            if (unmastered.length >= 3) {
                return [...unmastered];
            } else {
                // 混合：未掌握的 + 部分已掌握的（最多补到6个）
                const pool = [...unmastered];
                const need = Math.max(0, 6 - pool.length);
                const shuffled = shuffleArray([...mastered]);
                for (let i = 0; i < Math.min(need, shuffled.length); i++) {
                    pool.push(shuffled[i]);
                }
                return pool.length > 0 ? pool : [...appData];
            }
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        /** 生成考试队列 */
        function buildExamQueue() {
            const pool = getExamPool();
            if (pool.length === 0) {
                examQueue = [];
                examIndex = 0;
                examAnswered = false;
                examStats = { total: 0, correct: 0, wrong: 0 };
                return;
            }
            // 随机打乱
            const shuffled = shuffleArray([...pool]);
            // 每个题目生成考题（可能包含上下句互换）
            examQueue = shuffled.map(item => {
                const isPoem = item.type === 'poem';
                let question, answer, hint;
                if (isPoem) {
                    // 随机：给上句考下句 或 给下句考上句
                    const useUp = Math.random() < 0.5;
                    if (useUp) {
                        question = item.content;
                        answer = item.extra;
                        hint = `（给出上句，填写下句）`;
                    } else {
                        question = item.extra;
                        answer = item.content;
                        hint = `（给出下句，填写上句）`;
                    }
                } else if (item.type === 'character') {
                    // 看拼音写词语
                    question = item.extra; // 拼音
                    answer = item.content;
                    hint = `（看拼音写词语）`;
                } else {
                    // 句子：给内容考出处？或者给内容考内容？ 简单点：显示内容，考出处
                    question = item.content;
                    answer = item.source;
                    hint = `（写出出处）`;
                }
                return {
                    ...item,
                    _question: question,
                    _answer: answer,
                    _hint: hint,
                    _userAnswer: '',
                    _isCorrect: null,
                };
            });
            examIndex = 0;
            examAnswered = false;
            examStats = { total: examQueue.length, correct: 0, wrong: 0 };
            document.getElementById('examSub').textContent =
                `共 ${examQueue.length} 题 · 已答 0/${examQueue.length}`;
        }

        /** 渲染当前考题 */
        function renderExam() {
            const body = document.getElementById('examBody');
            if (appData.length === 0) {
                body.innerHTML = `
                    <div class="exam-empty">
                        <div class="big-icon">📭</div>
                        <p>还没有错题，先去 <strong>录入</strong> 一些吧！</p>
                    </div>
                `;
                return;
            }

            if (examQueue.length === 0 || examIndex >= examQueue.length) {
                // 重新生成
                buildExamQueue();
                if (examQueue.length === 0) {
                    body.innerHTML = `<div class="exam-empty"><div class="big-icon">🎉</div><p>所有题目已掌握！太棒了！</p></div>`;
                    return;
                }
            }

            const q = examQueue[examIndex];
            if (!q) {
                body.innerHTML = `<div class="exam-empty"><p>没有更多题目了</p></div>`;
                return;
            }

            const total = examQueue.length;
            const done = examQueue.filter(e => e._isCorrect !== null).length;
            document.getElementById('examSub').textContent =
                `共 ${total} 题 · 已答 ${done}/${total} · 正确 ${examStats.correct} 错误 ${examStats.wrong}`;

            const isAnswered = q._isCorrect !== null;
            const isCorrect = q._isCorrect === true;
            const isWrong = q._isCorrect === false;

            let resultHtml = '';
            if (isAnswered) {
                const cls = isCorrect ? 'correct' : 'wrong';
                const icon = isCorrect ? '✅' : '❌';
                const msg = isCorrect ? '回答正确！' : `回答错误，正确答案：${q._answer}`;
                resultHtml = `
                    <div class="exam-result show ${cls}">
                        ${icon} ${msg}
                    </div>
                `;
            }

            // 类型标签
            const typeMap = {
                character: '字/词',
                sentence: '句子',
                poem: '诗词'
            };
            const typeLabel = typeMap[q.type] || q.type;

            body.innerHTML = `
                <div class="exam-question">
                    <span class="tag">${typeLabel}</span>
                    ${q._question}
                    <span class="source-label">· ${q.source}</span>
                    <span style="font-size:14px;font-weight:400;color:#94a3b8;margin-left:8px;">${q._hint || ''}</span>
                </div>
                <div class="exam-answer-area">
                    <input type="text" id="examInput" placeholder="输入答案..." 
                           value="${q._userAnswer || ''}" 
                           ${isAnswered ? 'disabled' : ''}
                           class="${isCorrect ? 'correct' : ''} ${isWrong ? 'wrong' : ''}" />
                    ${!isAnswered ? `<button class="btn-primary" id="examSubmitBtn">提交</button>` : ''}
                    ${isAnswered ? `<button class="btn-secondary" id="examNextBtn">下一题 →</button>` : ''}
                </div>
                ${resultHtml}
                <div class="exam-actions" style="margin-top:8px;">
                    ${isAnswered ? `<span class="text-muted">${q.mastered ? '⭐ 已掌握' : '📌 未掌握'}</span>` : ''}
                </div>
            `;

            // 事件绑定
            if (!isAnswered) {
                const input = document.getElementById('examInput');
                const submitBtn = document.getElementById('examSubmitBtn');
                if (input && submitBtn) {
                    input.focus();
                    const handleSubmit = () => {
                        const val = input.value.trim();
                        if (!val) {
                            showToast('请输入答案', 'error');
                            return;
                        }
                        const correct = val === q._answer.trim();
                        q._userAnswer = val;
                        q._isCorrect = correct;
                        if (correct) {
                            examStats.correct++;
                            // 如果之前错误次数>0，减少？不减少，但标记掌握逻辑：连续正确3次可标记掌握？
                            // 简单：正确一次就减少错误计数？ 这里只做记录
                            if (q.wrongCount > 0) q.wrongCount--;
                            // 如果错误次数为0，可标记为已掌握（但保留手动标记）
                        } else {
                            examStats.wrong++;
                            q.wrongCount = (q.wrongCount || 0) + 1;
                            q.mastered = false;
                        }
                        // 保存数据
                        saveData(appData);
                        renderExam();
                        renderSummary();
                        renderReviewTable();
                        updateBadges(appData);
                    };
                    submitBtn.addEventListener('click', handleSubmit);
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') handleSubmit();
                    });
                }
            } else {
                const nextBtn = document.getElementById('examNextBtn');
                if (nextBtn) {
                    nextBtn.addEventListener('click', () => {
                        examIndex++;
                        if (examIndex >= examQueue.length) {
                            // 所有题目答完，重新生成
                            buildExamQueue();
                            examIndex = 0;
                            if (examQueue.length === 0) {
                                renderExam();
                                renderSummary();
                                renderReviewTable();
                                return;
                            }
                        }
                        renderExam();
                        renderSummary();
                        renderReviewTable();
                    });
                }
            }
        }

        /** 重置考试 */
        document.getElementById('resetExamBtn').addEventListener('click', () => {
            buildExamQueue();
            examIndex = 0;
            renderExam();
            renderSummary();
            renderReviewTable();
            showToast('已重新出题', 'success');
        });

        // ================================================================
        //  智能总结
        // ================================================================
        function renderSummary() {
            const grid = document.getElementById('summaryGrid');
            const total = appData.length;
            const unmastered = appData.filter(d => !d.mastered).length;
            const mastered = appData.filter(d => d.mastered).length;
            const totalWrong = appData.reduce((sum, d) => sum + (d.wrongCount || 0), 0);
            const avgWrong = total > 0 ? (totalWrong / total).toFixed(1) : '0';

            // 错误排行（取前5）
            const sorted = [...appData].sort((a, b) => (b.wrongCount || 0) - (a.wrongCount || 0));
            const topWrong = sorted.filter(d => (d.wrongCount || 0) > 0).slice(0, 5);

            grid.innerHTML = `
                <div class="summary-card"><div class="num">${total}</div><div class="label">📚 总错题</div></div>
                <div class="summary-card"><div class="num ${unmastered > 0 ? 'warn' : 'ok'}">${unmastered}</div><div class="label">⏳ 未掌握</div></div>
                <div class="summary-card"><div class="num ${mastered > 0 ? 'ok' : ''}">${mastered}</div><div class="label">✅ 已掌握</div></div>
                <div class="summary-card"><div class="num">${avgWrong}</div><div class="label">📊 平均错误次数</div></div>
            `;

            const list = document.getElementById('wrongList');
            if (topWrong.length === 0) {
                list.innerHTML = `<div style="padding:8px 0;color:#94a3b8;font-size:14px;">🎉 没有常错题，继续保持！</div>`;
            } else {
                list.innerHTML = `
                    <div style="font-weight:500;font-size:14px;margin-bottom:6px;color:#475569;">🔁 常错排行</div>
                    ${topWrong.map((d, i) => `
                        <div class="item">
                            <span>${i+1}. ${d.content} <span style="color:#94a3b8;font-size:13px;">（${d.source}）</span></span>
                            <span class="count">错误 ${d.wrongCount || 0} 次</span>
                        </div>
                    `).join('')}
                `;
            }
        }

        // ================================================================
        //  错题列表（复习面板中的表格）
        // ================================================================
        function renderReviewTable() {
            const wrap = document.getElementById('reviewTableWrap');
            const search = document.getElementById('searchReview').value.toLowerCase();
            const filter = document.getElementById('filterType').value;

            let filtered = [...appData];
            if (filter !== 'all') {
                filtered = filtered.filter(d => d.type === filter);
            }
            if (search) {
                filtered = filtered.filter(d =>
                    d.content.toLowerCase().includes(search) ||
                    d.source.toLowerCase().includes(search) ||
                    (d.extra && d.extra.toLowerCase().includes(search))
                );
            }
            // 按创建时间倒序
            filtered.sort((a, b) => b.id - a.id);

            if (filtered.length === 0) {
                wrap.innerHTML = `<div class="empty-msg">📭 暂无匹配的错题</div>`;
                return;
            }

            const typeMap = {
                character: '字/词',
                sentence: '句子',
                poem: '诗词'
            };
            const typeCls = {
                character: 'character',
                sentence: 'sentence',
                poem: 'poem'
            };

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th style="width:40px;">#</th>
                            <th style="width:70px;">类型</th>
                            <th>内容</th>
                            <th style="width:120px;">出处</th>
                            <th style="width:100px;">辅助</th>
                            <th style="width:70px;">错误</th>
                            <th style="width:70px;">状态</th>
                            <th style="width:140px;">操作</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            filtered.forEach((d, idx) => {
                const extraDisplay = d.type === 'character' ? d.extra :
                    d.type === 'poem' ? d.extra : (d.extra || '-');
                const status = d.mastered ?
                    `<span class="dot-mastered"></span>已掌握` :
                    `<span class="dot-unmastered"></span>未掌握`;
                html += `
                    <tr>
                        <td>${idx+1}</td>
                        <td><span class="tag-type ${typeCls[d.type] || ''}">${typeMap[d.type] || d.type}</span></td>
                        <td><strong>${d.content}</strong></td>
                        <td>${d.source}</td>
                        <td style="font-size:13px;color:#64748b;">${extraDisplay}</td>
                        <td>${d.wrongCount || 0}</td>
                        <td>${status}</td>
                        <td>
                            <button class="btn-sm master" data-id="${d.id}">${d.mastered ? '取消掌握' : '标记掌握'}</button>
                            <button class="btn-sm del" data-id="${d.id}">删除</button>
                        </td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            wrap.innerHTML = html;

            // 事件绑定：标记掌握 / 删除
            wrap.querySelectorAll('.btn-sm.master').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = Number(btn.dataset.id);
                    const item = appData.find(d => d.id === id);
                    if (item) {
                        item.mastered = !item.mastered;
                        saveData(appData);
                        renderReviewPanel();
                        // 如果当前在考试中，刷新考试
                        renderExam();
                        showToast(item.mastered ? '✅ 已标记为掌握' : '📌 已取消掌握', 'success');
                    }
                });
            });
            wrap.querySelectorAll('.btn-sm.del').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = Number(btn.dataset.id);
                    if (confirm('确定要删除这条错题吗？')) {
                        appData = appData.filter(d => d.id !== id);
                        saveData(appData);
                        renderReviewPanel();
                        renderExam();
                        showToast('已删除', 'success');
                    }
                });
            });
        }

        // 搜索 / 筛选 事件
        document.getElementById('searchReview').addEventListener('input', renderReviewTable);
        document.getElementById('filterType').addEventListener('change', renderReviewTable);

        // ================================================================
        //  下载试卷
        // ================================================================
        document.getElementById('downloadPaperBtn').addEventListener('click', () => {
            if (examQueue.length === 0) {
                showToast('没有题目可下载，请先录入错题', 'error');
                return;
            }
            // 生成试卷文本
            let lines = [];
            lines.push('📖 语文错题系统 · 试卷');
            lines.push(`生成时间：${new Date().toLocaleString()}`);
            lines.push('─'.repeat(40));
            lines.push('');

            examQueue.forEach((q, idx) => {
                const typeMap = {
                    character: '字/词',
                    sentence: '句子',
                    poem: '诗词'
                };
                const typeLabel = typeMap[q.type] || q.type;
                let questionText = q._question;
                let hintText = q._hint || '';
                // 如果题目是拼音，标注
                if (q.type === 'character') {
                    questionText = `拼音：${q._question}`;
                }
                lines.push(`${idx+1}. ${typeLabel} · ${questionText}`);
                lines.push(`   出处：${q.source}`);
                if (hintText) lines.push(`   提示：${hintText}`);
                lines.push(`   答案：__________`);
                lines.push('');
            });

            lines.push('─'.repeat(40));
            lines.push(`共 ${examQueue.length} 题 · 加油！💪`);

            const content = lines.join('\n');
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `语文错题试卷_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('📥 试卷已下载', 'success');
        });

        // ================================================================
        //  导出 Excel（核心功能：放大、所有线可见）
        // ================================================================
        document.getElementById('exportExcelBtn').addEventListener('click', () => {
            if (appData.length === 0) {
                showToast('没有数据可导出', 'error');
                return;
            }

            // 准备数据
            const typeMap = {
                character: '字/词',
                sentence: '句子',
                poem: '诗词'
            };
            const rows = [
                ['序号', '类型', '内容', '出处', '辅助信息', '错误次数', '是否掌握', '创建时间']
            ];
            appData.forEach((d, i) => {
                const extraDisplay = d.type === 'character' ? d.extra :
                    d.type === 'poem' ? d.extra : (d.extra || '');
                rows.push([
                    i + 1,
                    typeMap[d.type] || d.type,
                    d.content,
                    d.source,
                    extraDisplay,
                    d.wrongCount || 0,
                    d.mastered ? '✅ 已掌握' : '⏳ 未掌握',
                    new Date(d.createdAt).toLocaleString(),
                ]);
            });

            // 创建工作簿
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(rows);

            // ====== 关键：设置列宽（放大） ======
            ws['!cols'] = [
                { wch: 8 }, // 序号
                { wch: 10 }, // 类型
                { wch: 30 }, // 内容
                { wch: 22 }, // 出处
                { wch: 28 }, // 辅助信息
                { wch: 12 }, // 错误次数
                { wch: 14 }, // 是否掌握
                { wch: 22 }, // 创建时间
            ];

            // ====== 关键：设置所有单元格边框（打印时所有线可见） ======
            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let R = range.s.r; R <= range.e.r; R++) {
                for (let C = range.s.c; C <= range.e.c; C++) {
                    const addr = XLSX.utils.encode_cell({ r: R, c: C });
                    if (!ws[addr]) ws[addr] = { t: 's', v: '' };
                    if (!ws[addr].s) ws[addr].s = {};
                    // 边框样式：细实线
                    ws[addr].s.border = {
                        top: { style: 'thin', color: { rgb: "444444" } },
                        bottom: { style: 'thin', color: { rgb: "444444" } },
                        left: { style: 'thin', color: { rgb: "444444" } },
                        right: { style: 'thin', color: { rgb: "444444" } },
                    };
                    // 字体大小（放大）
                    ws[addr].s.font = { sz: 12, name: '微软雅黑' };
                    // 表头加粗
                    if (R === 0) {
                        ws[addr].s.font = { sz: 13, bold: true, name: '微软雅黑' };
                        ws[addr].s.fill = { fgColor: { rgb: "E8EDF2" } };
                        ws[addr].s.alignment = { horizontal: 'center', vertical: 'center' };
                    } else {
                        ws[addr].s.alignment = { horizontal: 'left', vertical: 'center', wrapText: true };
                    }
                }
            }

            // 设置行高（放大）
            ws['!rows'] = [];
            for (let R = range.s.r; R <= range.e.r; R++) {
                ws['!rows'].push({ hpt: R === 0 ? 36 : 28 });
            }

            XLSX.utils.book_append_sheet(wb, ws, '错题本');
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `语文错题本_${new Date().toISOString().slice(0,10)}.xlsx`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`📊 成功导出 ${appData.length} 条数据！`, 'success');
        });

        // ================================================================
        //  初始化
        // ================================================================
        function init() {
            updateBadges(appData);
            updateExtraField();
            updateContentHint();
            // 默认进入录入
            switchTab('entry');
            // 如果数据不为空，预生成考试队列
            if (appData.length > 0) {
                buildExamQueue();
            }
            // 监听数据变化（每次保存后刷新）
            // 已经通过 saveData 触发更新
        }

        // 覆盖 saveData 以触发刷新
        const originalSave = saveData;
        saveData = function(data) {
            originalSave(data);
            if (currentTab === 'review') {
                renderReviewPanel();
                renderExam();
            }
            updateBadges(data);
        };

        // 重写 renderReviewPanel 以包含考试渲染
        const originalRenderReview = renderReviewPanel;
        renderReviewPanel = function() {
            originalRenderReview();
            // 确保 exam 同步
            if (examQueue.length === 0 && appData.length > 0) {
                buildExamQueue();
            }
            renderExam();
        };

        init();

        console.log('📖 语文错题系统已启动！');
        console.log(`📚 当前共 ${appData.length} 条错题`);
    </script>

</body>
</html>
